[project]
name = "lcverus"
version = "0.1.0"
description = "LangGraph + DeepSeek orchestration for verifying rustgym LeetCode solutions with Verus"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-deepseek>=1.1",
    "httpx>=0.28",
    "pyyaml>=6",
    "python-dotenv>=1",
    "markdownify>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lcverus = "lcverus.cli:main"

[tool.setuptools.packages.find]
include = ["lcverus*"]

[tool.setuptools.package-data]
lcverus = ["prompts/*.md"]
